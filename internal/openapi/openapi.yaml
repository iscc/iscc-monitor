openapi: 3.1.0
info:
  title: ISCC Monitor API
  version: "1.0"
  description: >-
    Machine-consumable HTTP surface of an ISCC Monitor instance: the
    tlog-tiles mirror artifacts, the computed RFC-6962 inclusion/consistency
    proofs, single-leaf record bytes, the downloadable proof bundle, the
    verify-for-me verdict, and the liveness/version/metrics endpoints.


    This contract describes ONLY the machine surface (JSON, opaque-byte
    artifacts, and Prometheus text). The human-facing server-rendered HTML
    surfaces — the realm index (`/`), the hub dossier (`/{domain}`), the log
    browser, and the HTML Certificate of Inclusion (`/inclusion/{iscc_id}`) —
    are deliberately OUT of this contract; they are documented by their
    rendered HTML and CLAUDE.md, not by OpenAPI.


    Every public GET answers cross-origin browser requests with
    `Access-Control-Allow-Origin: *`. The monitor is a verifiable cache, not a
    trusted oracle: prefer the client-verified proof bundle over the
    verify-for-me verdict (see that operation's description).
servers:
  - url: /
    description: This monitor instance (relative to its own origin).
tags:
  - name: health
    description: Liveness, build provenance, and metrics.
  - name: proofs
    description: Computed RFC-6962 inclusion/consistency proofs and record bytes.
  - name: mirror
    description: Raw mirrored tlog-tiles artifacts (checkpoint, tiles, OTS).
  - name: verify
    description: Client-verifiable proof bundle and the weaker verify-for-me verdict.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness and store readiness.
      description: >-
        Reports process liveness and SQLite store readiness. A non-200 means
        the instance is not ready to serve.
      responses:
        "200":
          description: The instance is live and the store is ready.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: The store is not ready, so the instance cannot serve.
          content:
            application/json:
              schema:
                type: object
  /version:
    get:
      tags: [health]
      operationId: getVersion
      summary: Build provenance.
      description: >-
        Returns the build-provenance string (the git short SHA, or the `dev`
        default for an un-stamped build), so an operator can confirm exactly
        which build is live.
      responses:
        "200":
          description: The build version string.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    examples: ["dev"]
  /metrics:
    get:
      tags: [health]
      operationId: getMetrics
      summary: Prometheus exposition.
      description: >-
        Prometheus text exposition of the monitor's series — hub status,
        last-observed sizes, poll failures, and violations. This is the
        Prometheus text format, not a JSON document, so it carries no JSON
        response schema.
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
  /openapi.json:
    get:
      tags: [health]
      operationId: getOpenAPIJSON
      summary: This OpenAPI 3.1 contract as JSON.
      description: The in-repo OpenAPI document, served byte-verbatim as JSON.
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
  /openapi.yaml:
    get:
      tags: [health]
      operationId: getOpenAPIYAML
      summary: This OpenAPI 3.1 contract as YAML.
      description: The in-repo OpenAPI document, served byte-verbatim as YAML.
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
  /{domain}/log/inclusion:
    get:
      tags: [proofs]
      operationId: getInclusionProof
      summary: Computed inclusion proof for an ISCC-ID.
      description: >-
        Returns the RFC-6962 inclusion proof for the named ISCC-ID against the
        monitor's accepted checkpoint, computed entirely from the local
        mirror (never re-hitting the hub). The default leaf is the lowest
        committed sequence for the id; an explicit `index` selects a specific
        committed sequence. The response mirrors the hub's
        `IsccLogInclusionProof` shape.
      parameters:
        - $ref: "#/components/parameters/Domain"
        - name: iscc_id
          in: query
          required: true
          description: The ISCC-ID to prove inclusion for (with or without the `ISCC:` prefix).
          schema:
            type: string
        - name: index
          in: query
          required: false
          description: An explicit committed leaf sequence; must match a committed seq for the id.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The computed inclusion proof.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing or malformed `iscc_id` / `index`.
        "404":
          description: The id is unknown, the leaf is not covered by the accepted checkpoint, or a tile is not mirrored.
  /{domain}/log/consistency:
    get:
      tags: [proofs]
      operationId: getConsistencyProof
      summary: Computed consistency proof to the accepted checkpoint.
      description: >-
        Returns the RFC-6962 consistency proof relating a client's prior
        trusted tree size (`from`) to the monitor's accepted tree size,
        computed from the local mirror. The degenerate `from == 0` and
        `from == accepted size` cases return an empty proof (200).
      parameters:
        - $ref: "#/components/parameters/Domain"
        - name: from
          in: query
          required: true
          description: The client's prior trusted tree size (M ≤ N, the accepted size).
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The computed consistency proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyEvidence"
        "400":
          description: Missing or non-numeric `from`, or `from` exceeds the accepted size.
        "404":
          description: No accepted checkpoint yet, `from` has no recorded checkpoint, or a tile is not mirrored.
  /{domain}/log/entries:
    get:
      tags: [proofs]
      operationId: getEntry
      summary: Single-leaf record bytes from the mirror.
      description: >-
        Returns the raw bytes of exactly one accepted leaf, addressed by its
        absolute leaf sequence (`index`), decoded from the mirrored entry
        bundle. This is one leaf's bytes, distinct from the raw whole-bundle
        BLOB served under `/tile/entries/...`.
      parameters:
        - $ref: "#/components/parameters/Domain"
        - name: index
          in: query
          required: true
          description: The absolute leaf sequence (schema-agnostic).
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The single leaf's record bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Missing or non-numeric `index`.
        "404":
          description: No accepted checkpoint yet, or the leaf is not covered by the accepted checkpoint.
  /{domain}/log/verify:
    get:
      tags: [verify]
      operationId: getVerifyForMe
      summary: verify-for-me verdict (the explicitly weaker, non-authoritative path).
      description: >-
        Returns a JSON verdict the caller TRUSTS the monitor for: the
        monitor reports the hub status, the accepted checkpoint `(size, root)`,
        and a Merkle-verified inclusion result for the id. This is the
        EXPLICITLY WEAKER, NON-AUTHORITATIVE tier-1 path — "the monitor
        reports". The authoritative path is tier-2: fetch the proof bundle
        (`GET /inclusion/{iscc_id}.bundle`) and verify it yourself, removing
        the monitor from the trust path. An id-shaped fault (unknown id,
        no accepted checkpoint, leaf out of tree, tile not mirrored) is a
        `200 {verified:false, reason}`, never a 4xx/5xx.
      parameters:
        - $ref: "#/components/parameters/Domain"
        - name: iscc_id
          in: query
          required: true
          description: The ISCC-ID to verify (with or without the `ISCC:` prefix).
          schema:
            type: string
      responses:
        "200":
          description: The verify-for-me verdict (verified true or false with a reason).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyVerdict"
        "500":
          description: A genuine infrastructure fault (store read error or store inconsistency).
  /{domain}/log/checkpoint:
    get:
      tags: [mirror]
      operationId: getCheckpoint
      summary: Mirrored signed checkpoint note.
      description: >-
        Returns the hub-signed checkpoint note (the tlog-tiles `checkpoint`
        artifact) for the accepted `(size, root)`, served verbatim from the
        local mirror. Distinct from the `.ots` Bitcoin-anchor proof.
      parameters:
        - $ref: "#/components/parameters/Domain"
      responses:
        "200":
          description: The mirrored signed checkpoint note.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: The checkpoint is not mirrored.
  /{domain}/log/checkpoint.ots:
    get:
      tags: [mirror]
      operationId: getCheckpointOTS
      summary: Mirrored OpenTimestamps proof for the accepted root.
      description: >-
        Returns the OpenTimestamps proof for the accepted `(size, root)`,
        served verbatim as an opaque byte stream so a client can run the
        standard `ots` toolchain against it. A different artifact from the
        signed `/checkpoint` note: this is the Bitcoin-anchor timestamp proof.
      parameters:
        - $ref: "#/components/parameters/Domain"
      responses:
        "200":
          description: The OpenTimestamps proof bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No accepted checkpoint yet, or the root is not yet anchored.
  /{domain}/log/tile/{tile}:
    get:
      tags: [mirror]
      operationId: getTile
      summary: Raw mirrored tlog-tiles BLOB.
      description: >-
        Returns a raw mirrored tlog-tiles hash tile or entry bundle BLOB at its
        canonical tlog-tiles path (e.g. `tile/0/000`, `tile/entries/000`),
        served verbatim from the local mirror.
      parameters:
        - $ref: "#/components/parameters/Domain"
        - name: tile
          in: path
          required: true
          description: The canonical tlog-tiles tile/bundle path suffix (may contain slashes).
          schema:
            type: string
      responses:
        "200":
          description: The raw tile or entry-bundle BLOB.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: The tile or bundle is not mirrored.
  /inclusion/{iscc_id}.bundle:
    get:
      tags: [verify]
      operationId: getProofBundle
      summary: Downloadable self-contained proof bundle.
      description: >-
        Returns a self-contained proof bundle — the hub-signed checkpoint, the
        inclusion proof, the record bytes, the hub key, and an OTS proof when
        anchored — that a client verifies on its own, removing the monitor from
        the trust path (the authoritative tier-2 path). The id is the
        self-describing ISCC-IDv1; the issuing hub is resolved realm-wide. The
        bundle is offered only when the monitor re-verified the inclusion proof
        against the accepted root; a non-certifiable id is an honest 200 "no
        proof bundle available", never a fabricated bundle and never a 5xx.
      parameters:
        - name: iscc_id
          in: path
          required: true
          description: The self-describing ISCC-IDv1 (the `.bundle` suffix selects the machine artifact).
          schema:
            type: string
      responses:
        "200":
          description: >-
            The proof bundle as a JSON attachment, OR an honest "no proof
            bundle available" verdict for a non-certifiable id.
          content:
            application/json:
              schema:
                type: object
components:
  parameters:
    Domain:
      name: domain
      in: path
      required: true
      description: A realm hub domain followed by this instance (e.g. `sb0.iscc.id`).
      schema:
        type: string
  schemas:
    ConsistencyEvidence:
      type: object
      description: An RFC-6962 consistency proof relating a prior tree size to the accepted size.
      properties:
        type:
          type: string
        firstSize:
          type: integer
          description: The client's prior trusted tree size (the `from` query param).
        secondSize:
          type: integer
          description: The monitor's accepted tree size.
        consistencyProof:
          type: array
          description: The RFC-6962 proof hashes, each base64-Std encoded.
          items:
            type: string
    VerifyVerdict:
      type: object
      description: >-
        The verify-for-me verdict. The monitor REPORTS this (tier-1, weaker);
        verify the proof bundle yourself for the authoritative result (tier-2).
      properties:
        iscc_id:
          type: string
        hub_status:
          type: string
          description: The store-provable hub status (frozen, else verified).
        tree_size:
          type: integer
          description: The accepted checkpoint tree size.
        root:
          type: string
          description: The accepted checkpoint root, base64-Std encoded.
        leaf_index:
          type: integer
        included:
          type: boolean
        verified:
          type: boolean
        reason:
          type: string
          description: A human-readable reason when `verified` is false.
