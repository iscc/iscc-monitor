# Builds the documentation site from docs/ with Zensical and the ISCC theme (zensical-iscc), checks it,
# and deploys it to GitHub Pages at monitor.iscc.codes (docs/CNAME). Pull requests build and check only;
# pushes to main deploy, so the site describes the released version. The documented proof-bundle verifier
# is run against the example bundle, so a change to either that breaks the guide fails here.
# Based on the theme's template, skills/iscc-docs-theme/docs-workflow.yml in iscc/zensical-iscc.
name: Docs

on:
  pull_request:
    paths: [docs/**, zensical.toml, pyproject.toml, uv.lock, CHANGELOG.md, .github/workflows/docs.yml]
  push:
    branches: [main]
    paths: [docs/**, zensical.toml, pyproject.toml, uv.lock, CHANGELOG.md, .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
      - run: uv sync --frozen --only-group docs
      - run: uv run --no-sync zensical-iscc build
      - run: uv run --no-sync zensical-iscc check --strict
      - name: Run the documented bundle verifier on the example bundle
        run: |
          cp docs/reference/MEIGKV5N6NTVF4AB.bundle.json "$RUNNER_TEMP/"
          uv run docs/guides/verify_bundle.py "$RUNNER_TEMP/MEIGKV5N6NTVF4AB.bundle.json"
          sed 's/"leafIndex":0/"leafIndex":1/' docs/reference/MEIGKV5N6NTVF4AB.bundle.json > "$RUNNER_TEMP/tampered.bundle.json"
          if uv run docs/guides/verify_bundle.py "$RUNNER_TEMP/tampered.bundle.json"; then
            echo "the verifier accepted a tampered bundle"; exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
